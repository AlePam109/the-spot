{% extends "base.html" %}

{% block title %}Login - The Spot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <h2 class="mb-3">Welcome Back</h2>
                <p class="text-muted">Sign in to continue to The Spot</p>
            </div>
            
            <form id="loginForm">
                <div class="text-center mb-4">
                    <div class="btn-group" role="group">
                        <input type="radio" class="btn-check" name="accountType" id="customer" value="customer" checked>
                        <label class="btn btn-outline-primary" for="customer">
                            <i class="fas fa-user me-2"></i>Customer Account
                        </label>
    
                        <input type="radio" class="btn-check" name="accountType" id="business" value="business">
                        <label class="btn btn-outline-primary" for="business">
                            <i class="fas fa-store me-2"></i>Business Account
                        </label>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0">Don't have an account? <a href="/create-account" class="text-decoration-none">Create one</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .input-group-text {
        background-color: var(--light-color);
        border: none;
        color: var(--primary-color);
    }

    .form-control {
        border-left: none;
    }

    .form-control:focus {
        box-shadow: none;
        border-color: #ddd;
    }

    .btn-primary {
        padding: 12px;
        font-weight: 500;
    }
</style>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // Add your login logic here
        console.log('Login attempt:', { username, password });
    });
</script>
{% endblock %}
