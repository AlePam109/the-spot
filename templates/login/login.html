<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Business theme: dark blue - silver */
            --business-primary: #1A237E;
            --business-secondary: #283593;
            --business-accent: #5C6BC0;
            --business-light: #E8EAF6;
            --business-dark: #0D1B2A;
            --business-silver: #B0BEC5;

            /* Customer theme: AMEX gold */
            --customer-primary: #D4AF37;
            --customer-secondary: #FFD700;
            --customer-accent: #FFC107;
            --customer-light: #FFF8E1;
            --customer-dark: #B8860B;

            /* Default theme */
            --primary-color: #2C3E50;
            --secondary-color: #34495E;
            --accent-color: #3498DB;
            --light-color: #ECF0F1;
            --success-color: #2ECC71;
            --warning-color: #F1C40F;
            --danger-color: #E74C3C;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-color);
            color: var(--primary-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }

        .btn-primary {
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .account-type-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .account-type-btn {
            padding: 0.5rem 1rem;
            border: 1px solid;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .account-type-btn:first-child {
            border-radius: 8px 0 0 8px;
        }

        .account-type-btn:last-child {
            border-radius: 0 8px 8px 0;
        }

        .account-type-btn.active {
            color: white;
        }

        .create-account-link {
            text-align: center;
            margin-top: 1rem;
        }

        .create-account-link a {
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .create-account-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--danger-color);
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        /* Business theme styles */
        .business-theme {
            background-color: var(--business-light);
            color: var(--business-dark);
        }

        .business-theme .login-header h1 {
            color: var(--business-primary);
        }

        .business-theme .form-control:focus {
            border-color: var(--business-accent);
            box-shadow: 0 0 0 0.2rem rgba(92, 107, 192, 0.25);
        }

        .business-theme .btn-primary {
            background-color: var(--business-accent);
            border-color: var(--business-accent);
        }

        .business-theme .btn-primary:hover {
            background-color: var(--business-secondary);
            border-color: var(--business-secondary);
        }

        .business-theme .account-type-btn {
            border-color: var(--business-accent);
            color: var(--business-accent);
        }

        .business-theme .account-type-btn.active {
            background-color: var(--business-accent);
        }

        .business-theme .create-account-link a {
            color: var(--business-accent);
        }

        /* Customer theme styles */
        .customer-theme {
            background-color: var(--customer-light);
            color: var(--customer-dark);
        }

        .customer-theme .login-header h1 {
            color: var(--customer-primary);
        }

        .customer-theme .form-control:focus {
            border-color: var(--customer-accent);
            box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25);
        }

        .customer-theme .btn-primary {
            background-color: var(--customer-accent);
            border-color: var(--customer-accent);
            color: var(--customer-dark);
        }

        .customer-theme .btn-primary:hover {
            background-color: var(--customer-secondary);
            border-color: var(--customer-secondary);
        }

        .customer-theme .account-type-btn {
            border-color: var(--customer-accent);
            color: var(--customer-accent);
        }

        .customer-theme .account-type-btn.active {
            background-color: var(--customer-accent);
        }

        .customer-theme .create-account-link a {
            color: var(--customer-accent);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-store me-2"></i>The Spot</h1>
            <p>Welcome back! Please login to continue.</p>
        </div>

        <div class="account-type-toggle">
            <button class="account-type-btn active" data-type="customer">Customer</button>
            <button class="account-type-btn" data-type="business">Business</button>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
        </form>

        <div class="error-message" id="errorMessage"></div>

        <div class="create-account-link">
            <p>Don't have an account? <a href="/create-account">Create one</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const accountTypeBtns = document.querySelectorAll('.account-type-btn');
            const body = document.body;
            let currentAccountType = 'customer';

            // Handle account type toggle
            accountTypeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    accountTypeBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentAccountType = this.dataset.type;
                    
                    // Update theme based on account type
                    body.classList.remove('business-theme', 'customer-theme');
                    body.classList.add(currentAccountType + '-theme');
                });
            });

            // Set initial theme
            body.classList.add('customer-theme');

            // Handle form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch(`/api/login/${currentAccountType}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Store user data in localStorage
                        localStorage.setItem('userData', JSON.stringify({
                            username: data.username,
                            accountType: data.account_type,
                            id: currentAccountType === 'business' ? data.account_id : data.user_id
                        }));

                        // Redirect to appropriate page
                        window.location.href = currentAccountType === 'business' ? '/manage' : '/search';
                    } else {
                        if (data.error === 'Invalid username or password') {
                            errorMessage.textContent = 'Invalid username or password. Please try again.';
                        } else {
                            errorMessage.textContent = data.error || 'Login failed. Please try again.';
                        }
                        errorMessage.style.display = 'block';
                    }
                } catch (error) {
                    errorMessage.textContent = 'An error occurred. Please try again.';
                    errorMessage.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
