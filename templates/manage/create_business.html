<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Create Business</title>
    <script type="module" src="/static/business.js"></script>
</head>
<body>
    <h2>Create a New Business</h2>

    <form id="createBusinessForm">
        <label>Name: <input type="text" name="name" required /></label><br />
        <label>Address: <input type="text" name="address" required /></label><br />
        <label>City: <input type="text" name="city" required /></label><br />
        <label>State: <input type="text" name="state" required /></label><br />
        <label>Postal Code: <input type="text" name="postal_code" required /></label><br />
        <label>Latitude: <input type="number" step="any" name="latitude" required /></label><br />
        <label>Longitude: <input type="number" step="any" name="longitude" required /></label><br />
        <label>Stars: <input type="number" step="0.1" name="stars" required /></label><br />
        <label>Review Count: <input type="number" name="review_count" required /></label><br />
        <label>
            Is Open:
            <select name="is_open">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>
        </label><br />
        <label>Attributes (JSON): <textarea name="attributes" required>{}</textarea></label><br />
        <label>Categories (comma-separated): <input type="text" name="categories" required /></label><br />
        <label>Hours (JSON): <textarea name="hours" required>{}</textarea></label><br /><br />

        <button type="submit">Create Business</button>
    </form>
</body>
</html>
