{% extends "base.html" %}

{% block title %}Account Management - The Spot{% endblock %}

{% block content %}
    <div class="account-container">
        <div id="welcomeContainer" class="mb-4"></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Account Management</h2>
            <a href="/search" class="btn btn-outline-primary">
                <i class="fas fa-home me-2"></i>Home
            </a>
        </div>
        
        <ul class="nav nav-tabs" id="accountTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab">Profile</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="security-tab" data-bs-toggle="tab" data-bs-target="#security" type="button" role="tab">Security</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="activity-tab" data-bs-toggle="tab" data-bs-target="#activity" type="button" role="tab">Activity</button>
            </li>
        </ul>

        <div class="tab-content" id="accountTabsContent">
            <!-- Profile Tab -->
            <div class="tab-pane fade show active" id="profile" role="tabpanel">
                <form id="profileForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="yelpingSince" class="form-label">Yelping Since</label>
                        <input type="text" class="form-control" id="yelpingSince" readonly>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>

            <!-- Security Tab -->
            <div class="tab-pane fade" id="security" role="tabpanel">
                <form id="passwordForm">
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">Current Password</label>
                        <input type="password" class="form-control" id="currentPassword" required>
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Change Password</button>
                </form>
                <hr>
                <div class="mt-4">
                    <h5>Delete Account</h5>
                    <p class="text-danger">Warning: This action cannot be undone.</p>
                    <button class="btn btn-danger" onclick="confirmDeleteAccount()">Delete Account</button>
                </div>
            </div>

            <!-- Activity Tab -->
            <div class="tab-pane fade" id="activity" role="tabpanel">
                <div id="reviewsList">
                    <h4>Your Reviews</h4>
                    <div id="userReviews"></div>
                </div>
                <div id="tipsList" class="mt-4">
                    <h4>Your Tips</h4>
                    <div id="userTips"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getSession, clearSession } from '/static/session.js';

        document.addEventListener('DOMContentLoaded', function() {
            const userData = getSession();
            if (!userData) {
                window.location.href = '/';
                return;
            }

            // Display welcome message
            const welcomeMessage = document.createElement('div');
            welcomeMessage.className = 'alert alert-info';
            welcomeMessage.innerHTML = `Welcome, ${userData.username || 'User'}!`;
            document.getElementById('welcomeContainer').appendChild(welcomeMessage);

            // Load user profile
            async function loadProfile() {
                try {
                    console.log('Fetching profile for user ID:', userData.id);
                    const response = await fetch(`/api/account?userId=${userData.id}`);
                    const data = await response.json();
                    console.log('Profile response:', data);
                    
                    if (data.success) {
                        document.getElementById('username').value = data.profile.username;
                        document.getElementById('name').value = data.profile.name;
                        document.getElementById('yelpingSince').value = new Date(data.profile.yelping_since).toLocaleDateString();
                    } else {
                        showError('Failed to load profile information');
                    }
                } catch (error) {
                    console.error('Error loading profile:', error);
                    showError('Error loading profile information');
                }
            }

            // Show error message
            function showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'alert alert-danger';
                errorDiv.textContent = message;
                document.querySelector('.account-container').appendChild(errorDiv);
                setTimeout(() => errorDiv.remove(), 5000);
            }

            // Show success message
            function showSuccess(message) {
                const successDiv = document.createElement('div');
                successDiv.className = 'alert alert-success';
                successDiv.textContent = message;
                document.querySelector('.account-container').appendChild(successDiv);
                setTimeout(() => successDiv.remove(), 5000);
            }

            // Load user activity
            async function loadActivity() {
                try {
                    const response = await fetch(`/api/account/activity?userId=${userData.id}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        // Display reviews
                        const reviewsList = document.getElementById('userReviews');
                        reviewsList.innerHTML = data.reviews.map(review => `
                            <div class="activity-card">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5>${review.business_name}</h5>
                                    <div class="star-rating">
                                        ${Array(5).fill().map((_, i) => 
                                            i < review.stars ? 
                                            '<i class="fas fa-star"></i>' : 
                                            '<i class="far fa-star"></i>'
                                        ).join('')}
                                    </div>
                                </div>
                                <p>${review.text}</p>
                                <small class="text-muted">${new Date(review.date).toLocaleDateString()}</small>
                            </div>
                        `).join('');

                        // Display tips
                        const tipsList = document.getElementById('userTips');
                        tipsList.innerHTML = data.tips.map(tip => `
                            <div class="activity-card">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5>${tip.business_name}</h5>
                                    <span class="text-muted">
                                        <i class="fas fa-heart"></i> ${tip.compliment_count}
                                    </span>
                                </div>
                                <p>${tip.text}</p>
                                <small class="text-muted">${new Date(tip.date).toLocaleDateString()}</small>
                            </div>
                        `).join('');
                    }
                } catch (error) {
                    console.error('Error loading activity:', error);
                }
            }

            // Handle profile update
            document.getElementById('profileForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const body = {
                    user_id: userData.id,
                    name: document.getElementById('name').value
                };

                try {
                    const response = await fetch('/api/account/update', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    const data = await response.json();
                    if (data.success) {
                        showSuccess('Profile updated successfully');
                        // Update welcome message with new name
                        welcomeMessage.innerHTML = `Welcome, ${body.name}!`;
                    } else {
                        showError(data.error || 'Failed to update profile');
                    }
                } catch (error) {
                    console.error('Error updating profile:', error);
                    showError('An error occurred while updating your profile');
                }
            });

            // Handle password change
            document.getElementById('passwordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (newPassword !== confirmPassword) {
                    showError('New passwords do not match');
                    return;
                }

                const body = {
                    user_id: userData.id,
                    current_password: document.getElementById('currentPassword').value,
                    new_password: newPassword
                };

                try {
                    const response = await fetch('/api/account/password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    const data = await response.json();
                    if (data.success) {
                        showSuccess('Password changed successfully');
                        this.reset();
                    } else {
                        showError(data.error || 'Failed to change password');
                    }
                } catch (error) {
                    console.error('Error changing password:', error);
                    showError('An error occurred while changing your password');
                }
            });

            // Load initial data
            loadProfile();
            loadActivity();
        });

        function confirmDeleteAccount() {
            if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
                deleteAccount();
            }
        }

        async function deleteAccount() {
            const userData = getSession();
            
            try {
                const response = await fetch('/api/account/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: userData.id
                    })
                });

                const data = await response.json();
                if (data.success) {
                    clearSession();  // This will handle the logout and redirect
                } else {
                    showError(data.error || 'Failed to delete account');
                }
            } catch (error) {
                console.error('Error deleting account:', error);
                showError('An error occurred while deleting your account');
            }
        }
    </script>
{% endblock %}
