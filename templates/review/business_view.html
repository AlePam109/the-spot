{% extends "base.html" %}

{% block title %}Business Details - The Spot{% endblock %}

{% block content %}
    <div class="business-header">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 id="businessName"></h1>
            <div>
                <span id="businessStatus" class="badge"></span>
                <span id="businessStars" class="stars ms-2"></span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <p id="businessAddress"></p>
                <p id="businessCityState"></p>
                <p id="businessHours"></p>
            </div>
            <div class="col-md-6">
                <h5>Attributes</h5>
                <div id="businessAttributes"></div>
            </div>
        </div>
    </div>

    <div class="review-section">
        <h3>Reviews</h3>
        <div id="reviewsList"></div>
    </div>

    <div class="tip-section">
        <h3>Tips</h3>
        <div id="tipsList"></div>
    </div>

    <script type="module">
        import { getSession } from '/static/session.js';

        document.addEventListener('DOMContentLoaded', function() {
            const userData = getSession();
            const urlParams = new URLSearchParams(window.location.search);
            const businessId = urlParams.get('businessId');

            if (!businessId) {
                window.location.href = '/search';
                return;
            }

            async function loadBusinessDetails() {
                try {
                    const response = await fetch(`/api/business/${businessId}`);
                    const data = await response.json();
                    
                    if (data.success) {
                        const business = data.business;
                        
                        // Update business header
                        document.getElementById('businessName').textContent = business.name;
                        document.getElementById('businessStatus').textContent = business.is_open ? 'Open' : 'Closed';
                        document.getElementById('businessStatus').classList.add(business.is_open ? 'bg-success' : 'bg-danger');
                        
                        // Update stars
                        const starsContainer = document.getElementById('businessStars');
                        starsContainer.innerHTML = Array(5).fill().map((_, i) => 
                            i < business.stars ? 
                            '<i class="fas fa-star"></i>' : 
                            '<i class="far fa-star"></i>'
                        ).join('');
                        
                        // Update address and location
                        document.getElementById('businessAddress').innerHTML = `
                            <i class="fas fa-map-marker-alt me-2"></i>${business.address}
                        `;
                        document.getElementById('businessCityState').textContent = `${business.city}, ${business.state}`;
                        
                        // Update hours
                        const hours = JSON.parse(business.hours);
                        document.getElementById('businessHours').innerHTML = `
                            <h5>Hours</h5>
                            ${Object.entries(hours).map(([day, time]) => `
                                <p class="mb-1">${day}: ${time}</p>
                            `).join('')}
                        `;
                        
                        // Update attributes
                        const attributes = JSON.parse(business.attributes);
                        document.getElementById('businessAttributes').innerHTML = Object.entries(attributes)
                            .map(([key, value]) => `
                                <p class="mb-1">
                                    <strong>${key}:</strong> ${value}
                                </p>
                            `).join('');
                    }
                } catch (error) {
                    console.error('Error loading business details:', error);
                }
            }

            async function loadReviews() {
                try {
                    const response = await fetch(`/api/business/${businessId}/reviews`);
                    const data = await response.json();
                    
                    if (data.success) {
                        const reviewsList = document.getElementById('reviewsList');
                        reviewsList.innerHTML = data.reviews.map(review => `
                            <div class="card mb-3">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title">${review.user_name}</h5>
                                        <div class="stars">
                                            ${Array(5).fill().map((_, i) => 
                                                i < review.stars ? 
                                                '<i class="fas fa-star"></i>' : 
                                                '<i class="far fa-star"></i>'
                                            ).join('')}
                                        </div>
                                    </div>
                                    <p class="card-text">${review.text}</p>
                                    <small class="text-muted">${new Date(review.date).toLocaleDateString()}</small>
                                </div>
                            </div>
                        `).join('');
                    }
                } catch (error) {
                    console.error('Error loading reviews:', error);
                }
            }

            async function loadTips() {
                try {
                    const response = await fetch(`/api/business/${businessId}/tips`);
                    const data = await response.json();
                    
                    if (data.success) {
                        const tipsList = document.getElementById('tipsList');
                        tipsList.innerHTML = data.tips.map(tip => `
                            <div class="card mb-3">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title">${tip.user_name}</h5>
                                        <span class="text-muted">
                                            <i class="fas fa-heart"></i> ${tip.compliment_count}
                                        </span>
                                    </div>
                                    <p class="card-text">${tip.text}</p>
                                    <small class="text-muted">${new Date(tip.date).toLocaleDateString()}</small>
                                </div>
                            </div>
                        `).join('');
                    }
                } catch (error) {
                    console.error('Error loading tips:', error);
                }
            }

            // Load all data
            loadBusinessDetails();
            loadReviews();
            loadTips();
        });
    </script>
{% endblock %}
