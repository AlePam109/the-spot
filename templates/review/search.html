{% extends "base.html" %}

{% block title %}Search - The Spot{% endblock %}

{% block content %}
    <div class="search-container">
        <form id="searchForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" class="form-control" id="searchTerm" placeholder="Search for businesses...">
                </div>
                <div class="col-md-4 mb-3">
                    <input type="text" class="form-control" id="location" placeholder="Location (city, state)">
                </div>
                <div class="col-md-2 mb-3">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search me-2"></i>Search
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div id="searchResults"></div>

    <script type="module">
        import { getSession } from '/static/session.js';

        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('searchForm');
            const searchResults = document.getElementById('searchResults');

            searchForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const searchTerm = document.getElementById('searchTerm').value;
                const location = document.getElementById('location').value;

                try {
                    const response = await fetch('/api/search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            searchTerm,
                            location
                        })
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        if (data.businesses.length > 0) {
                            searchResults.innerHTML = data.businesses.map(business => `
                                <div class="card">
                                    <div class="card-header">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <h5 class="mb-0">${business.name}</h5>
                                            <span class="stars">
                                                ${Array(5).fill().map((_, i) => 
                                                    i < business.stars ? 
                                                    '<i class="fas fa-star"></i>' : 
                                                    '<i class="far fa-star"></i>'
                                                ).join('')}
                                            </span>
                                        </div>
                                    </div>
                                    <div class="card-body">
                                        <p class="mb-1">${business.address}</p>
                                        <p class="mb-1">${business.city}, ${business.state}</p>
                                        <p class="mb-1">
                                            <span class="${business.is_open ? 'open' : 'closed'}">
                                                <i class="fas fa-circle me-1"></i>${business.is_open ? 'Open' : 'Closed'}
                                            </span>
                                        </p>
                                        <p class="mb-0">${business.review_count} reviews</p>
                                        <a href="/business/${business.business_id}" class="btn btn-primary mt-3">
                                            View Details
                                        </a>
                                    </div>
                                </div>
                            `).join('');
                        } else {
                            searchResults.innerHTML = `
                                <div class="no-results">
                                    <i class="fas fa-search"></i>
                                    <h3>No results found</h3>
                                    <p>Try adjusting your search terms</p>
                                </div>
                            `;
                        }
                    } else {
                        searchResults.innerHTML = `
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-circle me-2"></i>An error occurred while searching
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error('Error searching:', error);
                    searchResults.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle me-2"></i>An error occurred while searching
                        </div>
                    `;
                }
            });
        });
    </script>
{% endblock %}
